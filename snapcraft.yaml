name: tildeshot
version: '15.0.0'
base: core24
summary: Powerful yet simple to use screenshot software
description: |
  A powerful open source screenshot and annotation tool for Linux, Tildeshot
  has a varied set of markup tools available, which include Freehand drawing,
  Lines, Arrows, Boxes, Circles, Highlighting, Blur. Additionally, you can
  customise the color, size and/or thickness of many of these image annotation
  tools.
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
#  arm64:
#    build-on: [arm64]
#    build-for: [arm64]

apps:
  tildeshot:
    command: usr/bin/tildeshot
    desktop: usr/share/applications/org.tildeshot.Tildeshot.desktop
    common-id: org.tildeshot.Tildeshot
    extensions: [kde-neon-6]
    slots: [dbus-tildeshot]
    plugs:
      - home
      - gsettings
      - removable-media

parts:
  tildeshot:
    plugin: cmake
    source: .
    build-packages:
      - libxkbcommon-dev
      - libproxy-dev
    cmake-parameters:
      - -DTILDESHOT_ICON=/snap/tildeshot/current/usr/share/icons/hicolor/scalable/apps/tildeshot.svg
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DUSE_WAYLAND_CLIPBOARD=1
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/org.tildeshot.Tildeshot.svg|' ${CRAFT_PART_INSTALL}/usr/share/applications/org.tildeshot.Tildeshot.desktop
      sed -i 's/^\(Name\(\[.\+\]\)\?=.*\)$/\1 [Snap]/g' ${CRAFT_PART_INSTALL}/usr/share/applications/org.tildeshot.Tildeshot.desktop

slots:
  # Depending on in which environment we're running we either need
  # to use the system or session DBus so we also need to have one
  # slot for each.
  dbus-tildeshot:
    interface: dbus
    bus: session
    name: org.tildeshot.Tildeshot

layout:
  /usr/share/tildeshot/translations:
    symlink: $SNAP/usr/share/tildeshot/translations
