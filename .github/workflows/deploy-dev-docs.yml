name: Deploy developer docs

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'docs/dev/**'
      - '.github/workflows/deploy-dev-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Keep 22.04: its doxygen 1.9.1 works with mkdoxy 1.0.0, doxygen 1.9.4 crashes it.
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get --yes --quiet update
          sudo apt-get --yes --no-install-recommends install doxygen
          pip install \
              mkdocs==1.6.1 \
              mkdocs-material==9.7.7 \
              git+https://github.com/veracioux/mkdoxy@v1.0.0

      - name: Checkout tildeshot source
        uses: actions/checkout@v6

      - name: Build docs
        working-directory: docs/dev
        run: |
          make build

      - name: Upload docs as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dev/output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
